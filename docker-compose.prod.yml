# ── RecipeApp — Production override (Phase 11 §4.2) ───────────────────────────
#
# Layered over docker-compose.yml on the self-hosted PC:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Values come from the git-ignored .env next to this file (template: .env.example).
# - Images are pulled from GHCR (built by .github/workflows/deploy.yml), never built here.
# - Postgres and the API are not published on the host.
# - The frontend binds to 127.0.0.1 only, so it is off the LAN; `tailscale serve` proxies to it.
# - The project has its own name and no fixed container names, so it can run on the development
#   machine beside the dev stack without sharing its containers or volumes (D18, §4.10).
# `!reset` (drop a value) and `!override` (replace it instead of merging) need Docker Compose 2.24+.

# Without this the project is named after the clone's folder: `recipeapp`, the same as the dev clone.
name: recipeapp-prod

services:

  # docker-compose.yml's fixed container names are unique per machine and would clash with the dev
  # stack. With them reset, Compose names the containers recipeapp-prod-<service>-1.
  postgres:
    container_name: !reset null
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports: !reset []

  api:
    container_name: !reset null
    image: ghcr.io/eightbyte/recipeapp-api:${RECIPEAPP_IMAGE_TAG:-latest}
    build: !reset null
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=recipeapp;
        Username=recipeapp;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports: !reset []

  frontend:
    container_name: !reset null
    image: ghcr.io/eightbyte/recipeapp-frontend:${RECIPEAPP_IMAGE_TAG:-latest}
    build: !reset null
    ports: !override
      - "127.0.0.1:${RECIPEAPP_HTTP_PORT:-80}:80"
