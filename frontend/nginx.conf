server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback — all routes served from index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API calls to the .NET backend ───────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Proxy uploaded recipe images to the backend (same-origin) ─────────────
    # The uploads volume lives on the API container, so images are served via the
    # API. Same-origin keeps the PWA recipe-images runtime cache (CacheFirst) valid.
    location /uploads/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Service worker & manifest must always revalidate so updates ship ──────
    # (Placed before the broad static rule below so it takes precedence.)
    location ~* (sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }

    # ── Cache static assets aggressively ─────────────────────────────────────
    # Hashed precache assets are safe to pin for a year.
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2|woff|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript application/manifest+json;
    gzip_min_length 1000;
}
