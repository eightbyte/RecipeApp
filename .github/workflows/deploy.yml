# ── RecipeApp — test, build and publish images (Phase 11 §4.4) ────────────────
#
# On every push to master: run both test suites, then build and push the API and frontend
# images to GHCR, tagged with the commit SHA and `latest`. The self-hosted PC pulls `latest`
# (deploy/update.ps1). A failed test job means nothing is pushed, so the PC keeps the last
# good image.

name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/eightbyte/recipeapp-api
  FRONTEND_IMAGE: ghcr.io/eightbyte/recipeapp-frontend
  # `revision` lets deploy/update.ps1 name a pre-update dump after the image it replaces.
  # `source` links the GHCR packages to this repository.
  IMAGE_LABELS: |
    org.opencontainers.image.revision=${{ github.sha }}
    org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # SDK version comes from global.json, which local builds honour too.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Testcontainers uses the runner's Docker daemon.
      - name: Test
        working-directory: backend
        run: dotnet test RecipeApp.Tests/RecipeApp.Tests.csproj

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Node version comes from frontend/.nvmrc, which must match frontend/Dockerfile.
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test

  publish-images:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend/RecipeApp.API
          platforms: linux/amd64
          push: true
          labels: ${{ env.IMAGE_LABELS }}
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          labels: ${{ env.IMAGE_LABELS }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
